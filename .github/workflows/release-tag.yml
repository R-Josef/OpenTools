name: Dispatch release from tag

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch release workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f tag="${{ github.ref_name }}"
