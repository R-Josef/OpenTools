name: Build release packages

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run test suite
        run: mvn -B test

  linux-x64:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential file jq libbz2-dev libcurl4-openssl-dev \
            liblzma-dev libtool unzip zlib1g-dev
      - name: Build Linux package
        run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: target/release/*
          if-no-files-found: error
          retention-days: 7

  macos-x64:
    needs: validate
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install packaging tools
        run: command -v jq >/dev/null || brew install jq
      - name: Build macOS x64 package
        run: bash scripts/package-macos.sh x64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: target/release/*
          if-no-files-found: error
          retention-days: 7

  macos-arm64:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install packaging tools
        run: command -v jq >/dev/null || brew install jq
      - name: Build macOS arm64 package
        run: bash scripts/package-macos.sh arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: target/release/*
          if-no-files-found: error
          retention-days: 7

  windows-x64:
    needs: validate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MSYS
          update: true
          install: make gcc
          path-type: inherit
      - name: Build Windows package
        shell: pwsh
        env:
          OPENTOOLS_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: target/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - linux-x64
      - macos-x64
      - macos-arm64
      - windows-x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          find dist -maxdepth 1 -type f -print
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
