name: MEME Cygwin build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: cygwin/cygwin-install-action@v7
        id: cygwin
        with:
          packages: >-
            gcc-core,gcc-g++,make,perl,autoconf,automake,libtool,pkg-config,
            libxml2-devel,libxslt-devel,zlib-devel,libpng-devel,libgd-devel,
            freetype-devel,expat-devel,curl,tar,gzip,bzip2,python3,patch,
            perl-XML-Parser
      - name: Build MEME
        shell: pwsh
        run: |
          $root = "${{ steps.cygwin.outputs.root }}"
          $bash = Join-Path $root "bin\bash.exe"
          $cygpath = Join-Path $root "bin\cygpath.exe"
          $workspace = & $cygpath -u "$env:GITHUB_WORKSPACE"
          $output = & $cygpath -u "$env:RUNNER_TEMP\meme-cygwin"
          & $bash -lc "cd '$workspace' && MEME_SHA256=0406FB7B1DC27F6AAB3D6D3A29ECDF617BBDD946690CFA97CA2129BC210BFD12 bash scripts/build-meme-cygwin.sh '$output'"
      - name: Smoke test
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP "meme-cygwin\bin"
          & (Join-Path $bin "meme.exe") -version
          if ($LASTEXITCODE -ne 0) { throw "meme.exe -version failed" }
          & (Join-Path $bin "mast.exe") -version
          if ($LASTEXITCODE -ne 0) { throw "mast.exe -version failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: meme-cygwin
          path: ${{ runner.temp }}\meme-cygwin
          if-no-files-found: error
          retention-days: 7
